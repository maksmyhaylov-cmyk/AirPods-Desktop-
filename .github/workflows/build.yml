name: Build AirPodsWin

on:
  push:
    paths:
      - "src/**"
      - ".github/workflows/build.yml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish single-file exe
        run: dotnet publish src/AirPodsWin.csproj -c Release -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: AirPodsWin
          path: publish/AirPodsWin.exe

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/AirPodsWin.exe
